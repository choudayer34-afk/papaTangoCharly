<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pilotage</title>
  <meta name="description" content="Assistant personnel de pilotage professionnel" />
  <meta name="theme-color" content="#4C56C4" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/components.css" />
  <!-- Applique le thème choisi AVANT le premier rendu (retour de Charles-Henri, 13/09/2026 :
       mode sombre avec interrupteur, voir js/services/themeStore.js) — un script classique,
       synchrone, plutôt qu'attendre le module ES de l'app (chargé en dernier, après tout le
       reste), pour ne jamais laisser flasher le mauvais thème le temps que l'app démarre. Ne
       fait QUE rejouer ici la même clé que themeStore.js, qui reste la seule source de vérité
       pour la lecture/écriture de ce réglage. -->
  <script>
    try {
      var pilotageTheme = localStorage.getItem("pilotage-theme");
      if (pilotageTheme === "dark" || pilotageTheme === "light") {
        document.documentElement.dataset.theme = pilotageTheme;
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <div class="empty-state"><span class="emoji">⏳</span>Chargement…</div>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
