    window.__PILOTAGE_USE_FIREBASE_EMULATOR__ = true;

    import * as projectsApi from "/js/domain/projects.js";
    import * as followUpsApi from "/js/domain/followups.js";

    import * as meetingsApi from "/js/domain/meetings.js";
    import * as decisionsApi from "/js/domain/decisions.js";

    import * as objectivesApi from "/js/domain/objectives.js";
    // Ajouté en LOT 13 (TODO-027, "🧠 Mon bureau" — post-it libres) : même principe que les

    window.__pilotageTestApi = {
      firebaseApi,
      storageApi,
      inboxApi,
      tasksApi,
      projectsApi,
      followUpsApi,
      tagsApi,
      linksApi,
      meetingsApi,
      decisionsApi,
      resourcesApi,
      objectivesApi,
      stickyNotesApi,
      promptsApi,
